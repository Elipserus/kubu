# Lanzador de apps de kubu (Alt+Espacio), al estilo Omarchy.
# Los colores los pone el tema activo en kubu-colors.ini: kubu theme <tema>.
[main]
include=~/.config/fuzzel/kubu-colors.ini
font=UbuntuMono Nerd Font:size=14
prompt="❯ "
icon-theme=breeze-dark
icons-enabled=yes
terminal=ghostty -e
layer=overlay
width=40
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=12
line-height=26

[border]
width=2
radius=12
